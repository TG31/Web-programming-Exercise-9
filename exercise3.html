<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      #addBtn {
        background-color: rgb(159, 242, 245);
        width: 100px;
        height: 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .box {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: rgb(159, 242, 245);
      }
    </style>
    <button
      style="background-color: rgb(159, 242, 245); width: 100px; height: 30px"
      id="addBtn"
    >
      Add circle
    </button>
    <div id="container"></div>
    <script>
      let index = Math.floor(Math.random() * 256);
      let index1 = Math.floor(Math.random() * 256);
      let index2 = Math.floor(Math.random() * 256);
      let add = document.getElementById("addBtn");
      add.addEventListener("click", () => {
        let circle = document.createElement("div");
        circle.classList.add("box");
        circle.style.backgroundColor = `rgb(${index}, ${index1}, ${index2})`;
        document.getElementById("container").appendChild(circle);
        index = Math.floor(Math.random() * 256);
        index1 = Math.floor(Math.random() * 256);
        index2 = Math.floor(Math.random() * 256);
        circle.addEventListener("click", () => {
          document.getElementById("container").removeChild(circle);
        });
      });
    </script>
  </body>
</html>
